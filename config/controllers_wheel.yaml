controller_manager:
  ros__parameters:
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rover_base_controller:
      type: diff_drive_controller/DiffDriveController

rover_controller_manager:
  ros__parameters:
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rover_base_controller:
      type: diff_drive_controller/DiffDriveController

rover_base_controller:
  ros__parameters:
    left_wheel_names:
      - left_front_wheel_joint
      - left_middle_wheel_joint
      - left_rear_wheel_joint
    right_wheel_names:
      - right_front_wheel_joint
      - right_middle_wheel_joint
      - right_rear_wheel_joint
    wheel_separation: 0.64
    wheel_radius: 0.15
    publish_rate: 50.0
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    open_loop: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
